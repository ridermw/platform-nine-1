<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171c1d" />
    <meta name="description" content="An explorable Victorian railway station, reconstructed as a real-time 3D world." />
    <title>Platform Nine | An arrival, out of time</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="world" aria-label="Interactive three-dimensional Victorian railway platform"></canvas>
    <section id="loading" role="status" aria-live="polite">
      <span class="eyebrow">A PLACE BETWEEN PLACES</span>
      <h1>Platform Nine</h1>
      <p id="loading-text">Preparing your arrival</p>
      <progress id="progress" max="1" value="0"></progress>
    </section>
    <div id="error" role="alert" hidden></div>
    <header id="identity" class="interface" hidden><span class="mark">9 <sup>3</sup>/<sub>4</sub></span><span>PLATFORM NINE<small>AN ARRIVAL, OUT OF TIME</small></span></header>
    <nav id="controls" class="interface" aria-label="World controls" hidden>
      <button id="explore">Explore the platform</button>
      <button id="reset" title="Return to the original viewpoint (R)">Original view</button>
      <button id="hide" title="Hide controls (H)">Hide UI</button>
    </nav>
    <p id="hint" class="interface" hidden>Drag to look · WASD to walk · Scroll to approach · R to return · H to hide</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
